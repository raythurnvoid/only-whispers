name: Release Windows (signed)

# Builds the Windows installer, has SignPath sign it, and publishes it as the
# GitHub release for the version in package.json. Free code signing for open
# source by SignPath Foundation; see "Code signing policy" in README.md.
#
# Needs, in the repo settings:
# - secret SIGNPATH_API_TOKEN
# - variable SIGNPATH_ORGANIZATION_ID
# - on SignPath: project "only-whispers", signing policy "release-signing", and
#   the artifact configurations "app" and "installer" from .signpath/

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SIGNPATH_PROJECT: only-whispers
  SIGNPATH_POLICY: release-signing

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the app folder
        run: |
          pnpm run prebuild:win
          pnpm run build:renderer
          pnpm exec electron-builder --win --dir --publish never

      # First pass: sign only-whispers.exe and our own helpers inside the app
      # folder, so the installed app is signed too, not just the installer.
      - name: Upload the app folder
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: dist/win-unpacked

      - name: Sign the app
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/win-signed

      - name: Build the installer from the signed app
        run: pnpm exec electron-builder --win nsis --prepackaged dist/win-signed --publish never

      # Second pass: sign the installer itself.
      - name: Upload the installer
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/*.exe

      - name: Sign the installer
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/installer-signed

      - name: Remake latest.yml and the blockmap
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/installer-signed -Filter *.exe | Select-Object -First 1
          node scripts/finish-signed-installer.js $installer.FullName

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --draft --title $version --target $env:GITHUB_SHA }
          gh release upload $tag (Get-ChildItem dist/release).FullName --clobber
          gh release edit $tag --draft=false --latest
