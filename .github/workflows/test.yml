name: Test

# Runs the unit tests on Linux, macOS and Windows, after building the native
# helpers on each system. Many tests only run on one system, so a green run on
# one machine is not enough.
#
# Try a change before it reaches main: push a branch and open a PR, or run
# `gh workflow run test.yml --ref <branch>`.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "website/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "website/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR stops the older run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # AT-SPI2 for linux-text-monitor; X11, Xtst, Xext and Xvfb for the
      # linux-fast-paste tests, which skip themselves without them.
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libatspi2.0-dev libglib2.0-dev libx11-dev libxtst-dev libxext-dev xvfb

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install
        run: pnpm install --frozen-lockfile

      # Compiles the helpers from this commit's sources, so a source that does
      # not build fails here.
      - name: Build the native helpers
        run: pnpm run compile:native

      - name: Test
        run: pnpm test

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm run format:check

      - name: Type check
        run: pnpm run typecheck

      - name: Translations
        run: pnpm run i18n:check
